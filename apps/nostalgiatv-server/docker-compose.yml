x-runtipi:
  schema_version: 2
services:
  nostalgiatv-server:
    image: purestream711/nostalgiatv-server:latest
    restart: unless-stopped
    ports:
      - 19850:19850/tcp
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
      - ${APP_DATA_DIR}/config:/app/config
      - ${APP_DATA_DIR}/logos:/app/logos
    environment:
      TZ: ${TZ:-Etc/UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    x-runtipi:
      internal_port: 19850
      is_main: true
